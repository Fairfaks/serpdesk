<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Все задачи выполнены 🎉</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <video src="victory.mp4" autoplay></video>
  <script>
    const v = document.querySelector('video');
    v.volume = 1;
    v.play().catch(() => {});
    // Окно закрывается само чуть после конца ролика.
    v.onended = () => setTimeout(() => window.close(), 700);
  </script>
</body>
</html>
